name: Cherwell Software
description: >-
  Cherwell Software was an IT service management (ITSM) vendor founded in 2004 and
  headquartered in Colorado Springs, Colorado. Its flagship Cherwell Service Management
  (CSM) platform, first released in 2007, let IT departments automate routine tasks,
  manage incidents, problems, changes, and assets, and build codeless workflows,
  later expanding into enterprise service management for HR, Facilities, Information
  Security, and Project Management. Cherwell was acquired by Ivanti on March 25, 2021,
  and its products were folded into the Ivanti Neurons portfolio: Cherwell ITSM became
  Ivanti Neurons for ITSM, Cherwell ITAM became Ivanti Neurons for ITAM, and Cherwell
  CORE became Ivanti's Enterprise Service Management offering. The cherwell.com domain
  now 301-redirects to Ivanti, and no standalone Cherwell-branded developer portal,
  API, or public specification remains. This profile is retained as an acquired-company
  record in the API Evangelist network.
